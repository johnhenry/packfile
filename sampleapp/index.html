<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Le Mem Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        padding: 20px;
      }
      #frame-container {
        margin-top: 20px;
      }
      iframe {
        width: 100%;
        height: 400px;
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <h1>Le Mem Demo</h1>
    <nav>
      <a href="#index.html">Home</a> | <a href="#page1.html">Page 1</a> |
      <a href="#page2.html">Page 2</a>
    </nav>
    <div id="frame-container">
      <iframe id="content-frame" src="/compiled/index.html"></iframe>
    </div>
    <script>
      const iframe = document.getElementById("content-frame");

      window.addEventListener("hashchange", () => {
        const path = window.location.hash.slice(1) || "index.html";
        iframe.src = `/compiled/${path}`;
      });

      // Initial load
      if (window.location.hash) {
        const path = window.location.hash.slice(1);
        iframe.src = `/compiled/${path}`;
      }
    </script>
  </body>
</html>
